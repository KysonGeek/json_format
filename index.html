<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="tools">
            <button id="validateBtn">格式化</button>
            <button id="compressBtn">压缩</button>
            <button id="escapeBtn">转义</button>
            <button id="unescapeBtn">去除转义</button>
            <button id="base64DecodeBtn">Base64解密</button>
            <button id="lombokToJsonBtn">Lombok转JSON</button>
            <button id="timeConverterBtn">时间戳转换</button>
            <button id="diffBtn">JSON对比</button>
            <button id="copyBtn">复制</button>
        </div>
        <div class="time-converter hidden">
            <div class="time-converter-header">
                <div class="option-group">
                    <span class="option-label">时区</span>
                    <select id="timeZoneOffsetSelect"></select>
                </div>
                <div class="option-group">
                    <span class="option-label">单位</span>
                    <select id="timestampUnitSelect">
                        <option value="auto">自动</option>
                        <option value="milliseconds">毫秒</option>
                        <option value="seconds">秒</option>
                    </select>
                </div>
                <button id="timeConvertBtn">转换</button>
            </div>
            <div class="time-converter-body">
                <div class="time-panel">
                    <div class="panel-title">时间戳</div>
                    <textarea id="timestampInput" class="time-textarea" spellcheck="false" wrap="off" placeholder="时间戳，每行一个"></textarea>
                </div>
                <div class="time-panel">
                    <div class="panel-title">时间字符串</div>
                    <textarea id="timeInput" class="time-textarea" spellcheck="false" wrap="off" placeholder="yyyy-MM-dd HH:mm:ss，每行一个"></textarea>
                </div>
            </div>
        </div>
        <div class="editor-container">
            <div class="line-numbers" id="lineNumbers"></div>
            <textarea id="editor" class="editor" spellcheck="false" placeholder="请输入JSON字符串..."></textarea>
            <div id="jsonDisplay" class="json-display"></div>
        </div>
        <div id="diffContainer" class="diff-container hidden">
            <iframe id="diffFrame" src="json-diff/index.html" frameborder="0"></iframe>
        </div>
        <div id="status" class="status hidden"></div>
    </div>

    <script src="script.js"></script>
